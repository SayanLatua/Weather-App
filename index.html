<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Weather App</h1>

    <div class="search">
      <input id="cityInput" type="text" placeholder="Enter city name" autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>

    <p id="message" class="message"></p>

    <section id="result" class="result hidden">
      <h2 id="cityName"></h2>
      <img id="icon" alt="Weather icon">
      <p id="temp" class="temp"></p>
      <p id="desc" class="desc"></p>
      <div class="details">
        <div><span>Feels like</span><strong id="feels"></strong></div>
        <div><span>Humidity</span><strong id="humidity"></strong></div>
        <div><span>Wind</span><strong id="wind"></strong></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
